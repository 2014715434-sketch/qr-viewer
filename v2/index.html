<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>正在打开…</title>
<script>
(function () {
  var TARGET = "https://qr.sznscc.cn/qr-viewer/v2/index.html";
  var url = TARGET + (location.search || "") + (location.hash || "");
  try { location.replace(url); } catch (e) { location.href = url; }
})();
</script>
<style>
  html,body{height:100%;margin:0;background:#0f1115;color:#e8eaed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  .sp{width:34px;height:34px;border:3px solid rgba(255,255,255,.18);
    border-top-color:#4c8dff;border-radius:50%;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .t{font-size:15px;letter-spacing:.5px;color:#c8ccd4;}
  .s{font-size:13px;color:#6b7280;}
  a{color:#4c8dff;text-decoration:none;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="sp"></div>
    <div class="t">正在打开…</div>
    <div class="s"><a id="manual" href="https://qr.sznscc.cn/qr-viewer/v2/index.html">如果没有自动跳转，点这里</a></div>
  </div>
  <script>
    document.getElementById("manual").href =
      "https://qr.sznscc.cn/qr-viewer/v2/index.html" + (location.search || "") + (location.hash || "");
  </script>
</body>
</html>
